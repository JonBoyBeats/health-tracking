<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<title>Health</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/supabase-js-2.118.0.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<main id="setup" class="shell" hidden>
  <h1>Health</h1>
  <p class="sub">Not connected yet. Add the Supabase URL and key to <code>js/config.js</code> (see SETUP.md).</p>
</main>

<main id="login" class="shell narrow" hidden>
  <h1>Health</h1>
  <p class="sub">Sign in once on this phone and it stays signed in.</p>
  <form id="login-form" class="stack">
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" hidden></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</main>

<main id="app" class="shell" hidden>
  <header class="top">
    <div id="people" class="seg" role="group" aria-label="Whose day"></div>
    <button id="open-settings" class="icon" aria-label="Settings">⚙︎</button>
  </header>

  <nav class="datebar">
    <button id="prev-day" class="icon" aria-label="Previous day">‹</button>
    <div class="date-label"><span id="day-label"></span><button id="go-today" class="link" hidden>Today</button></div>
    <button id="next-day" class="icon" aria-label="Next day">›</button>
  </nav>

  <section id="left" class="card left"></section>
  <section id="meals"></section>

  <button id="open-add" class="fab primary">+ Add</button>
</main>

<dialog id="entry">
  <form id="entry-form" class="stack" method="dialog">
    <h2 id="entry-title">Add food</h2>
    <label>What did you eat? <input name="description" required autocomplete="off" placeholder="e.g. Turkey sandwich"></label>
    <div class="grid5">
      <label>Calories <input name="calories" inputmode="decimal"></label>
      <label>Protein g <input name="protein" inputmode="decimal"></label>
      <label>Carbs g <input name="carbs" inputmode="decimal"></label>
      <label>Fat g <input name="fat" inputmode="decimal"></label>
      <label>Fiber g <input name="fiber" inputmode="decimal"></label>
    </div>
    <p id="calc-hint" class="hint"></p>
    <fieldset id="who-field">
      <legend>Who ate this?</legend>
      <div id="who" class="seg"></div>
    </fieldset>
    <label>Meal
      <select name="meal">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
        <option value="snack">Snacks</option>
      </select>
    </label>
    <div class="actions">
      <button id="entry-delete" type="button" class="danger" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" data-close>Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form id="settings-form" class="stack" method="dialog">
    <h2>Daily targets</h2>
    <div id="targets"></div>
    <p class="hint">Signed in as <span id="signed-in-as"></span></p>
    <div class="actions">
      <button id="sign-out" type="button" class="danger">Sign out</button>
      <span class="spacer"></span>
      <button type="button" data-close>Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" popover="manual" hidden></div>
</body>
</html>
